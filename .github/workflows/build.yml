name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q -o project.zip -d build_src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: build_src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp build_src/app/build/outputs/apk/debug/app-debug.apk VideoDownloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: VideoDownloader.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Video Downloader (latest APK)
          files: VideoDownloader.apk
